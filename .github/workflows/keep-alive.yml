name: Anti-veille du serveur (Render + Neon)

on:
  schedule:
    # Toutes les 10 minutes — sous les 15 min qui déclenchent la mise en
    # veille du forfait gratuit Render. Reste dans les 750h/mois offertes.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le backend
        run: curl -sf --max-time 60 https://vde.onrender.com/api/sante/ || echo "Ping échoué (le serveur était peut-être déjà en train de se réveiller) — sans conséquence."
