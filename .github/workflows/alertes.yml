name: Alertes quotidiennes (seuils critiques)

on:
  schedule:
    # 08:00 UTC = 08:00 Abidjan (UTC+0) — après les saisies du matin
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  alertes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les seuils et envoyer l'email récapitulatif
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          DJANGO_DEFAULT_FROM_EMAIL: ${{ secrets.DJANGO_DEFAULT_FROM_EMAIL }}
          DJANGO_ALERTES_EMAILS: ${{ secrets.DJANGO_ALERTES_EMAILS }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL n'est pas configuré (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Les réglages refusent de démarrer sans SECRET_KEY quand DEBUG=False.
          # Ce job ne signe rien — il lit la base et envoie un e-mail — donc une
          # clé jetable suffit, et vaut mieux que recopier celle de production
          # dans les secrets d'un dépôt public.
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py verifier_alertes
