name: Test de restauration de sauvegarde

on:
  workflow_dispatch: {}

jobs:
  test-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 18 comme Neon : restaurer un dump 18 dans un serveur 16 echoue.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vde_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Installer le client PostgreSQL 18
        # Et non le `postgresql-client` par defaut d'Ubuntu, en version 16 ou
        # 17 : pg_dump REFUSE de sauvegarder un serveur plus recent que lui, et
        # Neon tourne en 18.4. La verification nocturne a echoue des son
        # premier passage pour cette seule raison (09/08/2026).
        run: |
          set -euo pipefail
          CLE=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$CLE" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          DEPOT="https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "deb [signed-by=$CLE] $DEPOT" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Chemin ABSOLU verifie ici : /usr/bin/pg_dump est un lanceur qui
          # choisit tout seul une version installee, et il a choisi la 16 —
          # d'ou l'echec « server version mismatch » malgre l'installation
          # reussie de la 18 (09/08/2026).
          test -x /usr/lib/postgresql/18/bin/pg_dump
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Exporter la production (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL n'est pas configuré (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Neon : le point d'accès « pooler » tronque silencieusement
          # pg_dump. Toujours passer par le point d'accès direct.
          /usr/lib/postgresql/18/bin/pg_dump "${DATABASE_URL/-pooler/}" --no-owner --no-privileges > backup_test.sql
          echo "Taille de l'export : $(wc -c < backup_test.sql) octets"
          if [ "$(wc -c < backup_test.sql)" -lt 50000 ]; then
            echo "ÉCHEC : export vide ou tronqué — inutile d'essayer de le restaurer."
            exit 1
          fi

      - name: Restaurer dans une base vide et jetable
        env:
          PGPASSWORD: test
        run: /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -f backup_test.sql

      - name: Vérifier que les données restaurées sont cohérentes
        env:
          PGPASSWORD: test
        run: |
          echo "--- Fermes ---"
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -c "SELECT count(*) FROM exploitation_ferme;"
          echo "--- Bandes ---"
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -c "SELECT count(*) FROM exploitation_bande;"
          echo "--- Points journaliers ---"
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -c "SELECT count(*) FROM exploitation_pointjournalier;"
          echo "--- Sorties d'œufs ---"
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -c "SELECT count(*) FROM exploitation_sortieoeuf;"
          echo "--- Factures ---"
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d vde_restore_test -c "SELECT count(*) FROM exploitation_facture;"
          echo ""
          echo "Si ces nombres sont > 0 et cohérents avec la production, la restauration fonctionne."
